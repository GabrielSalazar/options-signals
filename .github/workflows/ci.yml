name: CI

on:
  push:
    branches: [main, 'f*', 'pref*']
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit detect-secrets
      - run: pip-audit --desc
      - run: detect-secrets scan --baseline .secrets.baseline 2>/dev/null || true
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-cov
      - run: pip install ruff
      - run: ruff check backend/ tests/
      - run: python -m pytest tests/ -q --ignore=tests/test_market_analysis.py
      - run: python -m pytest tests/test_market_analysis.py -q -k "not test_analysis_dados_insuficientes_retorna_422" --no-header

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
